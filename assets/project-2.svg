  </g>
  <text x="40" y="72" fill="#f3f8ff" font-family="Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="28" font-weight="700">Brenox SDK</text>
  <rect x="40" y="92" width="120" height="3" rx="1.5" fill="url(#p2Line)">
