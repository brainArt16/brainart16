<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" width="760" height="300">
  <defs>
    <linearGradient id="p2Bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1420"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="p2Line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5eead4"/>
      <stop offset="1" stop-color="#2ec4ff"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="756" height="296" rx="24" fill="url(#p2Bg)" stroke="#1d3348"/>
  <rect x="2" y="2" width="756" height="296" rx="24" fill="none" stroke="#5eead4" stroke-opacity=".12"/>
  <circle cx="660" cy="80" r="110" fill="#5eead4" opacity=".06">
    <animate attributeName="opacity" values=".04;.12;.04" dur="4s" repeatCount="indefinite"/>
  </circle>
  <g fill="none" stroke="#5eead4" stroke-opacity=".2" stroke-width="1.5">
    <circle cx="640" cy="90" r="36">
      <animate attributeName="r" values="28;44;28" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="90" r="58" stroke-dasharray="4 10">
