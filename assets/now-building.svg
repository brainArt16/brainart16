<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320">
  <defs>
    <linearGradient id="nAccent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2ec4ff"/>
      <stop offset="1" stop-color="#5eead4"/>
    </linearGradient>
    <linearGradient id="nRail" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#122033"/>
      <stop offset="1" stop-color="#0d1826"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" rx="28" fill="#070c14" stroke="#1b2f42"/>
  <rect x="1" y="1" width="1198" height="318" rx="27" fill="none" stroke="#2ec4ff" stroke-opacity=".08"/>

  <text x="56" y="58" fill="#5eead4" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="3">NOW_BUILDING</text>
  <text x="56" y="104" fill="#f2f7ff" font-family="Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="30" font-weight="700">Systems that solve real operational problems</text>

  <!-- progress rail -->
  <rect x="820" y="42" width="320" height="10" rx="5" fill="url(#nRail)"/>
  <rect x="820" y="42" width="180" height="10" rx="5" fill="url(#nAccent)">
    <animate attributeName="width" values="70;280;120;220;70" dur="4.5s" repeatCount="indefinite"/>
  </rect>
  <circle cx="1000" cy="47" r="7" fill="#f2f7ff">
    <animate attributeName="cx" values="890;1100;940;1040;890" dur="4.5s" repeatCount="indefinite"/>
  </circle>

  <!-- rows -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="16">
    <rect x="48" y="140" width="1104" height="44" rx="12" fill="#0b1420" stroke="#1a2d40"/>
    <circle cx="78" cy="162" r="5" fill="#2ec4ff">
      <animate attributeName="opacity" values="1;.35;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="168" fill="#7b93ad">01</text>
    <text x="148" y="168" fill="#d7e4f2">Healthcare &amp; pharmaceutical platforms</text>

    <rect x="48" y="196" width="1104" height="44" rx="12" fill="#0b1420" stroke="#1a2d40"/>
    <circle cx="78" cy="218" r="5" fill="#5eead4">
      <animate attributeName="opacity" values=".35;1;.35" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="224" fill="#7b93ad">02</text>
    <text x="148" y="224" fill="#d7e4f2">SaaS &amp; payment infrastructure</text>

    <rect x="48" y="252" width="1104" height="44" rx="12" fill="#0b1420" stroke="#1a2d40"/>
    <circle cx="78" cy="274" r="5" fill="#2ec4ff">
      <animate attributeName="opacity" values="1;.35;1" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <text x="100" y="280" fill="#7b93ad">03</text>
    <text x="148" y="280" fill="#d7e4f2">Realtime systems &amp; AI-powered products</text>
  </g>
</svg>
