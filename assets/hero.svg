<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" width="1600" height="520">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#070b14"/>
      <stop offset=".55" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#071018"/>
    </linearGradient>
    <linearGradient id="a" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#36bcf7"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse">
      <path d="M64 0H0V64" fill="none" stroke="#213047" stroke-opacity=".38"/>
    </pattern>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop stop-color="#36bcf7" stop-opacity=".28"/>
      <stop offset="1" stop-color="#36bcf7" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1600" height="520" rx="24" fill="url(#bg)"/>
  <rect width="1600" height="520" fill="url(#grid)"/>
  <circle cx="1280" cy="250" r="300" fill="url(#glow)">
    <animate attributeName="r" values="260;340;260" dur="5s" repeatCount="indefinite"/>
  </circle>

  <g fill="none" stroke="#36bcf7" stroke-opacity=".25" stroke-width="2">
    <path d="M980 80L1190 170L1390 100L1510 230L1320 350L1090 300Z">
      <animate attributeName="stroke-opacity" values=".1;.5;.1" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1060 420L1160 300L1370 380L1510 300">
      <animate attributeName="stroke-opacity" values=".4;.1;.4" dur="3s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#36bcf7">
    <circle cx="980" cy="80" r="5">
      <animate attributeName="r" values="3;8;3" dur="2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1190" cy="170" r="5">
      <animate attributeName="r" values="8;3;8" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1390" cy="100" r="5">
      <animate attributeName="r" values="3;8;3" dur="2.8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <rect x="82" y="92" width="720" height="1" fill="url(#a)"/>
  <text x="82" y="180" fill="#f3f7ff" font-family="Arial,sans-serif" font-size="56" font-weight="700">DAVID ANDERSON NDAGA</text>
  <text x="86" y="240" fill="#36bcf7" font-family="Arial,sans-serif" font-size="29" font-weight="700" letter-spacing="3">FULL-STACK SOFTWARE ENGINEER</text>
  <text x="86" y="292" fill="#b7c6d9" font-family="monospace" font-size="21">SaaS • Healthcare • Pharmaceutical • FinTech • AI</text>
  <rect x="84" y="336" width="560" height="52" rx="12" fill="#0d1726" stroke="#24435d"/>
  <circle cx="112" cy="362" r="7" fill="#63e6be">
    <animate attributeName="opacity" values=".3;1;.3" dur="1.8s" repeatCount="indefinite"/>
  </circle>
  <text x="132" y="369" fill="#b9f6dd" font-family="monospace" font-size="16" font-weight="600">BUILDING PRODUCTION SYSTEMS</text>
  <text x="86" y="442" fill="#61758f" font-family="monospace" font-size="16">FRONTEND → BACKEND → DATABASE → INFRASTRUCTURE</text>
