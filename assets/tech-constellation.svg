<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" width="1200" height="640">
  <defs>
    <radialGradient id="cGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#2ec4ff" stop-opacity=".38"/>
      <stop offset=".6" stop-color="#5eead4" stop-opacity=".08"/>
      <stop offset="1" stop-color="#2ec4ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cLine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2ec4ff" stop-opacity=".7"/>
      <stop offset="1" stop-color="#5eead4" stop-opacity=".2"/>
    </linearGradient>
    <filter id="cSoft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1200" height="640" rx="28" fill="#070c14"/>
  <circle cx="600" cy="310" r="190" fill="url(#cGlow)" filter="url(#cSoft)">
    <animate attributeName="r" values="160;210;160" dur="6s" repeatCount="indefinite"/>
  </circle>

  <!-- soft orbits -->
  <g fill="none" transform="translate(600 310)">
    <circle r="150" stroke="#2ec4ff" stroke-opacity=".12" stroke-dasharray="4 12">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="36s" repeatCount="indefinite"/>
    </circle>
    <circle r="230" stroke="#5eead4" stroke-opacity=".1" stroke-dasharray="2 16">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="48s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- connections -->
  <g fill="none" stroke="url(#cLine)" stroke-width="1.8" stroke-dasharray="6 8">
    <path d="M600 310L220 150"><animate attributeName="stroke-dashoffset" values="0;56" dur="3s" repeatCount="indefinite"/></path>
    <path d="M600 310L210 310"><animate attributeName="stroke-dashoffset" values="0;56" dur="3.4s" repeatCount="indefinite"/></path>
    <path d="M600 310L230 480"><animate attributeName="stroke-dashoffset" values="0;56" dur="3.8s" repeatCount="indefinite"/></path>
    <path d="M600 310L980 150"><animate attributeName="stroke-dashoffset" values="0;56" dur="3.2s" repeatCount="indefinite"/></path>
    <path d="M600 310L990 310"><animate attributeName="stroke-dashoffset" values="0;56" dur="3.6s" repeatCount="indefinite"/></path>
    <path d="M600 310L970 480"><animate attributeName="stroke-dashoffset" values="0;56" dur="4s" repeatCount="indefinite"/></path>
  </g>

  <!-- packets -->
  <g>
    <circle r="4" fill="#2ec4ff"><animateMotion dur="2.6s" repeatCount="indefinite" path="M600 310L220 150"/></circle>
    <circle r="4" fill="#5eead4"><animateMotion dur="3s" repeatCount="indefinite" path="M600 310L990 310"/></circle>
    <circle r="4" fill="#2ec4ff"><animateMotion dur="3.4s" repeatCount="indefinite" path="M600 310L230 480"/></circle>
    <circle r="4" fill="#5eead4"><animateMotion dur="2.9s" repeatCount="indefinite" path="M600 310L980 150"/></circle>
    <circle r="4" fill="#2ec4ff"><animateMotion dur="3.3s" repeatCount="indefinite" path="M600 310L210 310"/></circle>
    <circle r="4" fill="#5eead4"><animateMotion dur="3.7s" repeatCount="indefinite" path="M600 310L970 480"/></circle>
  </g>

  <!-- core -->
  <circle cx="600" cy="310" r="108" fill="#0b1522" stroke="#2ec4ff" stroke-opacity=".5" stroke-width="1.5"/>
  <circle cx="600" cy="310" r="84" fill="none" stroke="#5eead4" stroke-opacity=".2">
    <animate attributeName="r" values="74;96;74" dur="4.5s" repeatCount="indefinite"/>
  </circle>
  <text x="600" y="300" text-anchor="middle" fill="#ffffff" font-family="Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700">FULL-STACK</text>
  <text x="600" y="332" text-anchor="middle" fill="#ffffff" font-family="Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="22" font-weight="700">ENGINEERING</text>

  <!-- nodes -->
  <g font-family="Avenir Next,Segoe UI,Helvetica Neue,Arial,sans-serif" font-size="15" font-weight="600">
    <circle cx="220" cy="150" r="52" fill="#0b1522" stroke="#2ec4ff" stroke-opacity=".45"/>
    <circle cx="220" cy="150" r="58" fill="none" stroke="#2ec4ff" stroke-opacity=".15">
      <animate attributeName="r" values="54;64;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <text x="220" y="156" text-anchor="middle" fill="#dce8f5">FRONTEND</text>

    <circle cx="210" cy="310" r="52" fill="#0b1522" stroke="#2ec4ff" stroke-opacity=".45"/>
    <circle cx="210" cy="310" r="58" fill="none" stroke="#2ec4ff" stroke-opacity=".15">
      <animate attributeName="r" values="64;54;64" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="210" y="316" text-anchor="middle" fill="#dce8f5">BACKEND</text>

    <circle cx="230" cy="480" r="52" fill="#0b1522" stroke="#2ec4ff" stroke-opacity=".45"/>
    <circle cx="230" cy="480" r="58" fill="none" stroke="#2ec4ff" stroke-opacity=".15">
      <animate attributeName="r" values="54;64;54" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="230" y="486" text-anchor="middle" fill="#dce8f5">DATA</text>

    <circle cx="980" cy="150" r="52" fill="#0b1522" stroke="#5eead4" stroke-opacity=".45"/>
    <circle cx="980" cy="150" r="58" fill="none" stroke="#5eead4" stroke-opacity=".15">
      <animate attributeName="r" values="64;54;64" dur="3.4s" repeatCount="indefinite"/>
    </circle>
    <text x="980" y="156" text-anchor="middle" fill="#dce8f5">CLOUD</text>

    <circle cx="990" cy="310" r="52" fill="#0b1522" stroke="#5eead4" stroke-opacity=".45"/>
    <circle cx="990" cy="310" r="58" fill="none" stroke="#5eead4" stroke-opacity=".15">
      <animate attributeName="r" values="54;64;54" dur="3.8s" repeatCount="indefinite"/>
    </circle>
    <text x="990" y="316" text-anchor="middle" fill="#dce8f5">DEVOPS</text>

    <circle cx="970" cy="480" r="52" fill="#0b1522" stroke="#5eead4" stroke-opacity=".45"/>
    <circle cx="970" cy="480" r="58" fill="none" stroke="#5eead4" stroke-opacity=".15">
      <animate attributeName="r" values="64;54;64" dur="4.2s" repeatCount="indefinite"/>
    </circle>
    <text x="970" y="486" text-anchor="middle" fill="#dce8f5">AI / ML</text>
  </g>

  <text x="600" y="590" text-anchor="middle" fill="#6f869f" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="1.5">DESIGN → BUILD → DEPLOY → OBSERVE → IMPROVE</text>
</svg>
